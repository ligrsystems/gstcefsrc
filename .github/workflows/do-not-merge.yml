name: do-not-merge

# Required check `pr/do-not-merge`. It fails while the PR has the
# `do-not-merge` label and passes as soon as the label is removed.
# A ruleset on the default branch requires it, with no bypass, so
# nobody can merge past the label. To merge, remove the label.
#
# Cost: the job runs (and fails) only while the label is set. Without
# the label the job is skipped. A skipped job uses no runner minutes,
# and GitHub counts it as passing for a required check.
#
# The labeled and unlabeled events re-run this workflow, so the check
# follows the label at once. When a commit has more than one
# pr/do-not-merge run, GitHub obeys the run of the newest workflow
# run, even if an older run finishes later. So there is no
# concurrency group: a group made the newest run wait behind a slow
# runner (tested 3 Nov 2026).
#
# FORGEABLE (interim): a pull_request run uses the PR's own copy of
# this file, so a PR can edit the file to pass its own check. This
# stops accidental merges, not deliberate ones. The planned
# replacement posts the check from a GitHub App whose key only the
# default branch can use, and the ruleset pins the check to that App.
#
# Shared head commit: the check belongs to a commit. If two open PRs
# have the same head commit and only one has the label, an event on
# the other PR passes the commit for both. To block it again, remove
# and re-add the label on the labelled PR.
#
# Backfill: Actions > do-not-merge > Run workflow adds the check to
# each open PR that has none (for example, a PR opened before this
# workflow existed). It reads the current labels. It does not change
# a commit that already has the check.
#
# This file is identical in every ligrsystems repo. Change all copies
# together.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

jobs:
  do-not-merge:
    name: pr/do-not-merge
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Block the merge
        if: github.event_name == 'pull_request'
        run: |
          echo "::error::This PR has the do-not-merge label. Read the '**do-not-merge: reason**' comment on the PR. Remove the label to unblock the merge."
          exit 1

      - name: Add the check to open PRs that have none
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The check belongs to a commit, not to a PR. If any open PR
          # whose head is this commit has the label, the commit fails.
          for sha in $(gh pr list --state open --limit 1000 --json headRefOid \
              --jq '[.[].headRefOid] | unique | .[]'); do
            has=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?check_name=pr/do-not-merge&filter=all" \
              --jq .total_count)
            if [ "$has" != 0 ]; then
              echo "$sha has the check"
              continue
            fi
            # Read the labels again just before each post, to keep the
            # race with a concurrent label change short.
            blocked=$(gh pr list --state open --limit 1000 --json headRefOid,labels |
              jq -r --arg sha "$sha" \
                '[.[] | select(.headRefOid == $sha and any(.labels[]; .name == "do-not-merge"))] | length > 0')
            if [ "$blocked" = true ]; then
              conclusion=failure; title="do-not-merge label is set"
            else
              conclusion=success; title="No do-not-merge label"
            fi
            gh api "repos/$GH_REPO/check-runs" --silent \
              -f name=pr/do-not-merge -f head_sha="$sha" \
              -f status=completed -f conclusion="$conclusion" \
              -f "output[title]=$title" \
              -f "output[summary]=Added by the do-not-merge backfill run."
            echo "$sha $conclusion"
          done
