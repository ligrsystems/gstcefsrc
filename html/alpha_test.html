<!doctype html>
<html>
  <head>
    <!-- Four translucent stripes on a transparent page, checked by
         tests/check_alpha_frames.py. Keep geometry in sync with that file. -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      div { position: absolute; top: 0; height: 100%; width: 25%; }
    </style>
  </head>
  <body>
    <div style="left: 0%; background: rgba(255, 255, 255, 0.25)"></div>
    <div style="left: 25%; background: rgba(255, 255, 255, 0.5)"></div>
    <div style="left: 50%; background: rgba(255, 255, 255, 0.75)"></div>
    <div style="left: 75%; background: rgba(255, 128, 0, 0.5)"></div>
  </body>
</html>
